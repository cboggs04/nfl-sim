# Refreshes the precomputed data after each Sunday slate and after Monday Night Football, and commits it. The commit
# triggers a redeploy on Render, so the live site stays current. Run it by hand any time from the Actions tab.
# Times are UTC. Eastern time is UTC-5 in winter (UTC-4 until early November), so each run lands 1-2 hours after the
# games end. GitHub can start scheduled runs a few minutes late, and the site is only as fresh as nflverse's own data.
name: Refresh data

on:
  schedule:
    - cron: "0 22 * * 0"   # Sunday 5:00 pm ET: after the 1:00 pm games
    - cron: "30 1 * * 1"   # Sunday 8:30 pm ET: after the 4:05 / 4:25 pm games
    - cron: "0 6 * * 1"    # Monday 1:00 am ET: after Sunday Night Football
    - cron: "0 6 * * 2"    # Tuesday 1:00 am ET: after Monday Night Football
    - cron: "0 12 * * 2"   # Tuesday 7:00 am ET: catch-up for late stat corrections
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time; a run started while another is going waits for it instead of racing it to push.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      # The downloaded play-by-play summaries are big; keep them between runs so only the current season is fetched.
      - uses: actions/cache@v4
        with:
          path: backend/data/*.parquet
          key: nfl-data-${{ github.run_id }}
          restore-keys: nfl-data-

      - name: Rebuild ratings, simulations, rosters and awards
        working-directory: backend
        run: python -m scripts.precompute --refresh

      - name: Run the tests against the new data
        working-directory: backend
        run: python -m pytest -q

      - name: Commit the new data
        run: |
          # Commit as the repo owner, with the email on the GitHub account so the commit links to it: Vercel's free plan only
          # deploys commits made by the account owner, and refuses (and emails about) commits from a bot account.
          git config user.name "cboggs04"
          git config user.email "charlieboggs04@gmail.com"
          git add backend/data/*.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Refresh data $(date -u '+%Y-%m-%d %H:%M UTC')" && git pull --rebase && git push)
