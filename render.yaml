# Render blueprint for the API (Render dashboard: New > Blueprint, point it at this repo).
services:
  - type: web
    name: nfl-sim-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Set this in the Render dashboard to your Vercel URL, e.g. https://nfl-sim.vercel.app
      # (comma-separated for more than one). Required: the browser blocks the site from calling the API otherwise.
      - key: CORS_ORIGINS
        sync: false
